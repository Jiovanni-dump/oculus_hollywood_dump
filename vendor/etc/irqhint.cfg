# This irqhint config file is written in TOML: https://toml.io/en/v1.0.0
#
# Each table specifies an SMP affinity list for the corresponding
# hwirq value.  The hwirq values are chosen as they are permanent
# identifiers of IRQs, where the IRQ value can change between hardware
# revisions and possibly OS versions.  The hwirq values are availabe
# in "/proc/interrupts" as the value before the column containing
# "Edge" or "Level".
#
# These affinity values correspond to the CPU that will receive these
# interrupts, and will be written to
# "/proc/irq/<irq>/smp_affinity_list".
#
# Unlike the powerhints.cfg file, each hint/mode must specify the
# complete set of affinity values - they are not stacked.  If an
# affinity value for a hwirq is not specified, its value will be
# determined by the previous mode which may not be intended.

[default]
# WiFi interrupts - by default go to system cores
524291=0
524292=1
524293=2
524294=3
524297=0
524299=1
524301=2
524302=3
524303=0
524304=1
524305=2
524306=3
524307=0
524308=1

[WIFI_LOW_LATENCY]
# WiFi interrupts - in low latency mode, go to content cores which do
# not run RT processes and will therefore process WiFi IRQs with less
# delay.
524291=4
524292=5
524293=6
524294=4
524297=5
524299=6
524301=4
524302=5
524303=6
524304=4
524305=5
524306=6
524307=4
524308=5
