"priority" = 19

# This mode is used, for example, when displaying Guardian, ASW, or Overlay.
# Copied from VR_MODE_CPU_4 + VR_MODE_GPU_4, with a slightly higher priority.
# Said differently, VR_MODE_BOOSTED will have priority over CPU/GPU [1-4],
# and will have lower priority than CPU/GPU [5-X].
[VR_MODE_BOOSTED]
"/dev/cpu_dma_latency" = "0"
"/sys/class/devfreq/soc:qcom,cpu-cpu-llcc-bw/min_freq" = "9155"
"/sys/class/devfreq/soc:qcom,cpu-llcc-ddr-bw/min_freq" = "5161"
"/sys/class/devfreq/soc:qcom,gpubw/min_freq" = "3879"
"/sys/class/kgsl/kgsl-3d0/devfreq/max_freq" = "525000000"
"/sys/class/kgsl/kgsl-3d0/devfreq/min_freq" = "525000000"
"/sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq" = "1478400"
"/sys/devices/system/cpu/cpufreq/policy4/scaling_min_freq" = "1478400"
"/sys/devices/system/cpu/cpufreq/policy7/scaling_max_freq" = "2457600"
"/sys/devices/system/cpu/cpufreq/policy7/scaling_min_freq" = "1075200"
"/sys/devices/virtual/thermal/tz-by-name/cpu-1-0-limit/cdev0_upper_limit" = "10"
"/sys/devices/virtual/thermal/tz-by-name/cpu-1-1-limit/cdev0_upper_limit" = "10"
"/sys/devices/virtual/thermal/tz-by-name/cpu-1-2-limit/cdev0_upper_limit" = "10"
